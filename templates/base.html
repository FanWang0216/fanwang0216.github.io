<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title</title>
  <meta name="description" content="$description">
  <meta name="robots" content="index, follow">
  $google_verification
  <meta name="author" content="$name">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="$name, $degree">
  <meta property="og:title" content="$title">
  <meta property="og:description" content="$description">
  <meta property="og:url" content="$canonical">
  <meta property="og:image" content="$photo_url">
  <meta property="og:image:alt" content="$photo_alt">
  <meta name="twitter:card" content="summary">
  <script type="application/ld+json">$structured_data</script>
  <link rel="canonical" href="$canonical">
  <link rel="icon" type="image/svg+xml" href="${root}assets/favicon.svg">
  <link rel="stylesheet" href="${root}assets/style.css">
  <script src="${root}assets/site.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="masthead">
    <nav aria-label="Main navigation">
      <a class="site-name" href="$root">$name</a>
      <a $about_current href="$root">About</a>
      <a $research_current href="${root}research/">Research</a>
      <a href="${root}#teaching">Teaching</a>
      <a href="${root}#contact">Contact</a>
    </nav>
  </header>
  <div class="page-layout">
    <aside class="profile" aria-label="About $name">
      <img class="profile-photo" src="$photo" alt="$photo_alt" width="220" height="220">
      <h2>$name</h2>
      <p class="degree">$degree</p>
      <p class="role">$role</p>
      <p class="affiliation">$affiliation</p>
      <p class="location">$location</p>
      <ul class="profile-links">
        <li class="profile-email"><span>$mail_icon<span class="email-addresses">$email_links</span></span></li>
        <li><span>$wechat_icon<span>WeChat: <span class="wechat-id">$wechat</span></span></span></li>
        <li><a href="$linkedin" target="_blank" rel="noopener noreferrer">$linkedin_icon<span>LinkedIn</span></a></li>
      </ul>
    </aside>
    <main id="main" class="page-content">$body</main>
  </div>
  <footer class="site-footer"><div>© $year $footer</div></footer>
</body>
</html>
